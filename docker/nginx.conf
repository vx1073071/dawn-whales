# ═══════════════════════════════════════════════════════════════════
# DAWN WHALES v2.1.0 — nginx.conf (reverse proxy)
# ═══════════════════════════════════════════════════════════════════

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

  # ── Rate Limiting ──────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=ws:10m rate=10r/s;

  server {
    listen 3000;
    server_name _;

    # ── Frontend (Vite SPA) ──────────────────────────────────
    location / {
      root /app/dist;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }

    # Static assets (hashed → long cache)
    location /assets/ {
      root /app/dist;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # ── API Reverse Proxy ────────────────────────────────────
    location /api/ {
      limit_req zone=api burst=50 nodelay;
      proxy_pass http://127.0.0.1:4096;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    # ── WebSocket Upgrade ────────────────────────────────────
    location /ws {
      limit_req zone=ws burst=20 nodelay;
      proxy_pass http://127.0.0.1:4096;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 86400s;
    }

    # Health check endpoint
    location /health {
      proxy_pass http://127.0.0.1:4096/api/health;
      proxy_http_version 1.1;
      access_log off;
    }
  }
}
