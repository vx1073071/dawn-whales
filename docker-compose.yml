version: '3.8'

# TradingEasy - Docker Compose Services
# Used for backend microservices in Phase 3+

services:
  app:
    build: .
    container_name: tradingeasy-app
    ports:
      - "3000:3000"   # Vite dev server
      - "11111:11111" # OpenD (host network)
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - OPEND_HOST=host.docker.internal
      - OPEND_PORT=11111
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: tradingeasy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: tradingeasy-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  grafana:
    image: grafana/grafana:latest
    container_name: tradingeasy-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana-dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=tradingeasy
      - GF_USERS_ALLOW_SIGN_UP=false

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
